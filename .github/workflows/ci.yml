name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@788f783d2998994f7aab9691710911ed1bd762c9
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: '24.11.0'

  release-classification:
    name: Release classification
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"

      - name: Set up Node for release classification
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          check-latest: false

      - name: Require release-driving squash title for release-significant changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RAN_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RAN_RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAN_RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          RAN_RELEASE_PR_TITLE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_RELEASE_PR_NUMBER}" --jq '.title')"
          export RAN_RELEASE_PR_TITLE
          node scripts/release-classification.mjs

  quality:
    if: ${{ always() }}
    needs:
      - baseline
      - release-classification
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require normalized quality baseline
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          CLASSIFICATION_RESULT: ${{ needs.release-classification.result }}
        run: |
          printf 'baseline=%s\nclassification=%s\n' "$BASELINE_RESULT" "$CLASSIFICATION_RESULT"
          test "$BASELINE_RESULT" = success
          test "$CLASSIFICATION_RESULT" = success
