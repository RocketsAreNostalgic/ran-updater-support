name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@84dde4704058d71646f56c369981bb6aaf201e24
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: '24.11.0'

  quality:
    if: ${{ always() }}
    needs: baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Require normalized quality baseline
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
        run: |
          printf 'baseline=%s\n' "$BASELINE_RESULT"
          test "$BASELINE_RESULT" = success
